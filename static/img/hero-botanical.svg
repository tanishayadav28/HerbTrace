<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c3324"/>
      <stop offset="1" stop-color="#1b7a56"/>
    </linearGradient>
    <g id="leaf">
      <path d="M0 0 C 40 -60 120 -80 200 -40 C 150 20 60 40 0 0 Z" fill="#2fbf85" opacity=".22"/>
      <path d="M0 0 C 70 -22 130 -34 190 -40" stroke="#bff0d8" stroke-width="2" fill="none" opacity=".35"/>
    </g>
    <g id="sprig">
      <path d="M0 0 C 20 -120 40 -240 20 -380" stroke="#7fd1ab" stroke-width="3" fill="none" opacity=".45"/>
      <use href="#leaf" transform="translate(12,-70) rotate(-20)"/>
      <use href="#leaf" transform="translate(24,-140) rotate(160) scale(.9)"/>
      <use href="#leaf" transform="translate(32,-210) rotate(-25) scale(.85)"/>
      <use href="#leaf" transform="translate(34,-280) rotate(155) scale(.75)"/>
      <use href="#leaf" transform="translate(26,-350) rotate(-30) scale(.6)"/>
    </g>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1300" cy="180" r="260" fill="#f3d98b" opacity=".07"/>
  <use href="#sprig" transform="translate(1180,900) scale(1.5)"/>
  <use href="#sprig" transform="translate(1420,900) rotate(8) scale(1.2)"/>
  <use href="#sprig" transform="translate(940,900) rotate(-10) scale(1.1)"/>
  <use href="#sprig" transform="translate(120,900) rotate(6) scale(1.3)"/>
  <use href="#sprig" transform="translate(360,900) rotate(-8) scale(.9)"/>
</svg>
