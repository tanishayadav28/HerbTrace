{% extends "app_base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><h1>Change password</h1></div>
<div class="card-leaf p-4" style="max-width:520px">
  {% include "partials/form_errors.html" %}
  <form method="post" novalidate>{% csrf_token %}
    {% for field in form %}{% include "partials/field.html" %}{% endfor %}
    <button class="btn btn-leaf" type="submit">Save new password</button>
  </form>
</div>
{% endblock %}
