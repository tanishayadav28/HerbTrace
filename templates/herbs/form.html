{% extends "app_base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-head"><h1>{{ title }}</h1><a class="btn btn-ghost" href="{% url back %}">Back</a></div>
<div class="card-leaf p-4" style="max-width:720px">
  {% include "partials/form_errors.html" %}
  <form method="post" novalidate>{% csrf_token %}
    {% for field in form %}{% include "partials/field.html" %}{% endfor %}
    <button class="btn btn-leaf" type="submit">Save</button>
  </form>
</div>
{% endblock %}
